backend:
  name: github
  repo: fartmonarch/astro_blog
  branch: main

# 认证：GitHub Personal Access Token（登录页点 "Sign In with Token" 粘贴即可）
# 无需 OAuth App；Token 仅保存在浏览器 local storage。

# 图片走腾讯云 COS：CMS 里直接上传，文件不进仓库。
# 这里**故意不写 media_folder** —— 省略它就是官方关闭"内置仓库媒体存储"的方式，
# 于是媒体选择器里只剩 COS 一个去处。存量正文里的 /images/... 引用不受影响（文件仍在 public/ 下）。
#
# 凭据：access_key_id 填腾讯云访问密钥的 SecretId（36 字符，放配置里是安全的）；
#       **SecretKey（32 字符）不要写在这里**，首次浏览/上传时在 CMS 界面输入，只存浏览器 local storage。
#
# endpoint 与 public_url 是两件事，别混：
#   endpoint    = 列表/上传用的 S3 API 地址。**必须填桶级虚拟主机域名**，
#                 因为 COS 拒绝 path-style（会返回 PathStyleDomainForbidden），
#                 scripts/patch-sveltia-cos.ps1 已把拼接改成 ${endpoint}/${key}；
#                 浏览器直接请求它，所以这个桶**必须**配跨域 CORS。
#   public_url  = 只决定写进正文的图片 URL（自定义域名/CDN 填这里）。
media_libraries:
  aws_s3:
    access_key_id: AKIDBE3wgBWeehbTH1mUC6ujcR9tXEwc7Ofr
    bucket: fartmonarch-cos-1344165548
    region: ap-shanghai                    # 必须与桶所在地域一致，否则 SigV4 签名不匹配
    endpoint: https://fartmonarch-cos-1344165548.cos.ap-shanghai.myqcloud.com
    prefix: img/                           # 上传落到桶内 img/ 目录
    public_url: https://img.fartmonarch.xyz

site_url: https://fartmonarch.xyz

collections:
  - name: "blog"
    label: "博客文章"
    folder: "src/content/blog"
    create: true
    delete: true
    extension: md
    format: frontmatter
    # {{fields._slug}} 是 Sveltia 的特殊 token：编辑器里会多出一个必填的 Slug 输入框，
    # 新建文章时直接填英文短横线，省掉「先保存、再 ⋮ → Edit Slug 改名」这一步。
    # 保存前会校验：不能为空、不能含 "/" 或空格、不能与已有文章重名。
    # 想退回按标题自动生成文件名，改回 slug: "{{slug}}"
    slug: "{{fields._slug}}"
    editor:
      preview: false          # Astro 无现成预览 iframe，关闭避免报错
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "描述", name: "description", widget: "text" }
      - { label: "发布日期", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "更新日期（可选）", name: "updatedDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "分类", name: "categories", widget: "select", multiple: true, min: 0, max: 3, required: false, default: [], options: ["实习笔记","前端笔记","服务端笔记","运维笔记","电脑知识","Agent"], hint: "留空 = 未分类，之后可以随时回来补。只有这里选中的分类才会生成分类页面。" }
      - { label: "标签", name: "tags", widget: "list", default: [], required: false, hint: "只做关键词展示，不会生成分类页面。" }
      - { label: "正文", name: "body", widget: "markdown" }

  # ===== 项目展示 =====
  # 字段与 src/content.config.ts 的 project 集合严格一一对应，改一边必须同步改另一边。
  # 技术栈故意用文本框而不是 list 控件：不设白名单，自己用逗号分隔，构建时切成标签。
  - name: "project"
    label: "项目"
    label_singular: "项目"
    folder: "src/content/projects"
    create: true
    delete: true
    extension: md
    format: frontmatter
    # 项目没有 _slug 输入框，文件名由「项目名称」自动生成。
    # 名称若含中文，文件名也是中文——/projects/ 是单页、不用文件名当 URL，所以无所谓。
    slug: "{{slug}}"
    editor:
      preview: false
    summary: "{{title}} · {{status}}"
    sortable_fields: [title, status, featured]
    fields:
      - { label: "项目名称", name: "title", widget: "string" }
      - { label: "项目简介", name: "description", widget: "text", hint: "卡片上的一句话介绍，太长会被截断成 3 行显示。" }
      - { label: "状态", name: "status", widget: "select", options: ["维护中","开发中","已归档"], default: "维护中" }
      - { label: "平台", name: "platforms", widget: "select", multiple: true, required: false, default: [], options: ["github","gitee","npm"], hint: "选中哪些就在卡片上显示哪些平台图标。" }
      - { label: "精选", name: "featured", widget: "boolean", default: false, required: false, hint: "打开后首页「项目」模块优先展示它。" }
      - { label: "技术栈标签", name: "techStack", widget: "string", required: false, hint: "用逗号分隔，例如：React, JSON, Viewer, 阮周刊（中英文逗号、顿号都可以）。" }
      - { label: "封面图 URL", name: "cover", widget: "string", required: false, hint: "项目图标（COS 外链）。正方形 / 圆形都可以，按正方形小图标展示，图片会被完整缩放不裁切。留空则显示项目名的第一个字。" }
      - label: "项目链接"
        name: "links"
        widget: "object"
        required: false
        collapsed: true
        summary: "{{fields.live}}"
        hint: "三个都留空时，卡片底部不显示链接区。"
        fields:
          - { label: "项目上线地址", name: "live", widget: "string", required: false }
          - { label: "源码仓库地址", name: "repo", widget: "string", required: false }
          - { label: "npm 包地址", name: "npm", widget: "string", required: false }
      - { label: "备注（正文，可选）", name: "body", widget: "markdown", required: false, hint: "项目目前不做站内详情页，这里的内容不会展示；留作写备注用。" }
